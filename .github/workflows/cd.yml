name: CD

# Runs after CI succeeds on main (or manually).
# 1. Always: publish the Docker image to GitHub Container Registry (continuous delivery).
# 2. If the GCP_* repository variables exist: deploy to Cloud Run (continuous deployment).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  SERVICE: invoice-autopilot
  CONTAINER_PORT: "8000"

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.SERVICE }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write          # OIDC token for Workload Identity Federation (no JSON key stored)
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/invoice-autopilot:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push to Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |
            INVOICE_AUTOPILOT_CONFIG=/app/config/settings.cloud.yaml
            RATE_LIMIT_PER_HOUR=30
            AUTOSEED_HISTORY=120
          secrets: |
            LLM_API_KEY=llm-api-key:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --port=${{ env.CONTAINER_PORT }}
            --memory=2Gi
            --cpu-boost
            --min-instances=0
            --max-instances=1
            --concurrency=10
      - name: Smoke test the deployed service
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do curl -fs "$URL/health" && break; sleep 5; done
          curl -fs "$URL/health"
          echo "### Deployed: $URL/docs" >> "$GITHUB_STEP_SUMMARY"
