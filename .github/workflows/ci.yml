name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src app.py
      - name: Tests (mocked LLM, offline embeddings)
        run: pytest -v
      - name: Pipeline eval (oracle extraction, hashing embeddings)
        run: python evals/run_eval.py --oracle

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: invoice-autopilot:ci
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 invoice-autopilot:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
