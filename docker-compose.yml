# API on :8000, UI on :8501. Models are served by Ollama on the host.
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    environment:
      INVOICE_AUTOPILOT_CONFIG: /app/config/settings.docker.yaml
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    environment:
      INVOICE_AUTOPILOT_CONFIG: /app/config/settings.docker.yaml
